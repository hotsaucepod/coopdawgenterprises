<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1b1f2a" />
  <title>Mall Tycoon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232e8b57'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='bold'%3E%24%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <header id="hud-top" class="hidden">
      <div class="hud-cell">
        <div id="hud-floor" class="hud-floor">Floor 1</div>
        <div id="hud-progress" class="hud-sub">0 / 0 unlocked</div>
      </div>
      <div class="hud-cell center">
        <div id="hud-money" class="hud-money">$20</div>
      </div>
      <div class="hud-cell right">
        <div id="hud-stars" class="hud-stars">★★★★☆</div>
        <div id="hud-rating" class="hud-sub">Rating 70</div>
      </div>
    </header>

    <main id="game-container"></main>

    <div id="hud-hint" class="hidden"></div>

    <footer id="hud-bottom" class="hidden">
      <button id="btn-order" class="hud-btn">📦 Order</button>
      <button id="btn-build" class="hud-btn">🔨 Build</button>
      <button id="btn-elevator" class="hud-btn">🛗 Elevator</button>
    </footer>

    <div id="panel" class="panel hidden">
      <div class="panel-head">
        <div id="panel-title">Panel</div>
        <button id="panel-close" class="close-btn" aria-label="Close">✕</button>
      </div>
      <div id="panel-body" class="panel-body"></div>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <div id="modal-title" class="modal-title"></div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-buttons" class="modal-buttons"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
